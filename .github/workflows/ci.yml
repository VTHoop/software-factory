name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - run: claude plugin validate .
      - run: claude plugin validate plugins/software-factory
      - run: node --test
      - name: Check the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./plugins/software-factory/.claude-plugin/plugin.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
